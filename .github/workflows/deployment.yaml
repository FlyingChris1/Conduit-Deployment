name: Deployment

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout Code
        uses: actions/checkout@v4

     
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" \
            | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

     
      - name: Build backend image
        run: |
          docker build -t ghcr.io/flyingchris1/conduit-backend:latest ./conduit-backend
          docker push ghcr.io/flyingchris1/conduit-backend:latest

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/flyingchris1/conduit-frontend:latest ./conduit-frontend
          docker push ghcr.io/flyingchris1/conduit-frontend:latest

     
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
